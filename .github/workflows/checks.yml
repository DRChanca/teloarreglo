name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to "tools platform-tools"; the legacy tools package was removed.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Typecheck, unit tests, lint and both APKs
        env:
          TEST_SUPABASE_URL: ${{ vars.TEST_SUPABASE_URL }}
          TEST_SUPABASE_PUBLISHABLE_KEY: ${{ vars.TEST_SUPABASE_PUBLISHABLE_KEY }}
          PRESENTATION_SUPABASE_URL: ${{ vars.PRESENTATION_SUPABASE_URL }}
          PRESENTATION_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PRESENTATION_SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew :app:test :app:lint :app:assemblePruebasDebug :app:assemblePresentacionDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.sha }}
          path: |
            app/build/outputs/apk/
            app/build/reports/

  android-ui:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 scripts/android.py ui-test --serial emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-api${{ matrix.api }}-${{ github.sha }}
          path: app/build/reports/androidTests/

  supabase:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: supabase start > /dev/null
      - run: supabase test db
      - run: python3 scripts/contract_identity.py --local
      - run: python3 scripts/contract_catalogue.py --local
      - run: python3 scripts/contract_covers.py --local
      - run: python3 scripts/contract_chat.py --local
      - if: always()
        run: supabase stop
