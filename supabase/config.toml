project_id = "teloarreglo"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
jwt_expiry = 3600
enable_signup = true

[auth.email]
enabled = true
enable_confirmations = true
double_confirm_changes = true

[analytics]
enabled = false

# Public search: callers use the publishable key (not a JWT). The function itself
# returns only public data; it reads private locations with its own service role.
[functions.search-professionals]
verify_jwt = false

# Push dispatcher (#32): called by Supabase Cron with its own PUSH_DISPATCH_SECRET, not a user JWT.
[functions.deliver-push]
verify_jwt = false
